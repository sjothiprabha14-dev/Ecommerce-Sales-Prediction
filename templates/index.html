<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales Predictor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-image:
        linear-gradient(rgba(15, 35, 80, 0.55), rgba(15, 35, 80, 0.55)),
        url('https://images.unsplash.com/photo-1760865245520-21b0786f5236?fm=jpg&q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      color: #222;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
      color: #444;
      font-size: 0.9rem;
    }
    input[type="number"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.7rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #ecfdf5;
      border: 1px solid #10b981;
      border-radius: 8px;
      text-align: center;
      font-size: 1.1rem;
      color: #065f46;
    }
    .error {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #fef2f2;
      border: 1px solid #ef4444;
      border-radius: 8px;
      text-align: center;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sales Prediction</h1>
    <form method="POST">
      <label for="quantity">Quantity</label>
      <input type="number" step="any" name="quantity" id="quantity" required>

      <label for="unit_price">Unit Price</label>
      <input type="number" step="any" name="unit_price" id="unit_price" required>

      <label for="discount">Discount</label>
      <input type="number" step="any" name="discount" id="discount" required>

      <button type="submit">Predict</button>
    </form>

    {% if prediction is not none %}
      <div class="result">Predicted value: <strong>{{ prediction }}</strong></div>
    {% endif %}

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
